name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Align package versions with Expo SDK
        run: npx expo install --fix

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make app logo
        run: |
          pip install pillow
          python3 make_logo.py

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Stop code shrinking from breaking app startup
        run: |
          cd android
          printf '\nandroid.enableMinifyInReleaseBuild=false\nandroid.enableShrinkResourcesInReleaseBuilds=false\n' >> gradle.properties
          cat >> app/proguard-rules.pro <<'EOF2'

          -keep class * extends androidx.room.RoomDatabase { <init>(); }
          -keep class androidx.work.impl.WorkDatabase_Impl { *; }
          -keep class androidx.work.** { *; }
          EOF2
          grep -n "APPLICATION_ID" app/src/main/AndroidManifest.xml || echo "WARNING: AdMob app id missing"

      - name: Build APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: QR Pay Scanner APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
